<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mybelovedriji</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Inter, sans-serif;
  background: radial-gradient(circle at top, #ffd6ea, #fff0f6 40%, #ffe0e0 100%);
  min-height: 100vh;
  overflow: hidden;
  color: #4a2230;
}

.bg {
  position: fixed;
  inset: 0;
}

.heart {
  position: absolute;
  opacity: 0.22;
  animation: float 8s infinite ease-in-out;
}

.glass {
  width: min(920px, 92vw);
  background: rgba(255,255,255,0.55);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.5);
  border-radius: 32px;
  box-shadow: 0 20px 80px rgba(190,80,120,0.18);
  padding: 28px;
  position: relative;
  z-index: 2;
}

.wrap {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(2rem, 6vw, 4.5rem);
}

.sub {
  font-size: clamp(1rem, 2vw, 1.15rem);
  line-height: 1.8;
}

.btn {
  border: none;
  padding: 14px 22px;
  border-radius: 18px;
  font-weight: 700;
  cursor: pointer;
  transition: 0.2s;
}

.btn:hover {
  transform: scale(1.05);
}

.primary {
  background: linear-gradient(135deg, #ff73b3, #ff8d8d);
  color: white;
}

.secondary {
  background: white;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 14px;
  margin: 24px 0;
}

.card {
  background: rgba(255,255,255,0.72);
  padding: 18px;
  border-radius: 22px;
}

iframe {
  width: 100%;
  aspect-ratio: 16/9;
  border: 0;
  border-radius: 24px;
  margin-bottom: 20px;
}

@keyframes float {
  50% {
    transform: translateY(-26px);
  }
}
</style>
</head>

<body>
<div class="bg" id="bg"></div>

<div class="wrap">
  <div class="glass">
    <div id="app"></div>
  </div>
</div>

<script>
for (let i = 0; i < 22; i++) {
  const h = document.createElement("div");
  h.className = "heart";
  h.textContent = "💗";
  h.style.left = Math.random() * 100 + "%";
  h.style.top = Math.random() * 100 + "%";
  h.style.fontSize = (16 + Math.random() * 12) + "px";
  document.getElementById("bg").appendChild(h);
}

const app = document.getElementById("app");

const letter = `
My beloved Rijwana, these words are not enough to express my love for you. I can't wait to be with you in real life so I can finally show you how much I love you, because words can't even express 25% of what I feel for you.<br><br>
These words will never be enough to explain how much I love you, care about you, cherish you, and how badly I want to be with you forever.<br><br>
I love you so much, my Rijwana. 🥹💗
`;

function s0() {
  app.innerHTML = `
    <div style="text-align:center">
      <div class="title">For my Babeh, Riji 💗</div>
      <p class="sub">Funny how life brought me back to you. Somehow, through everything, my heart still found its way back.</p>
      <button class="btn primary" onclick="s1()">Open my heart 💌</button>
    </div>
  `;
}

function s1() {
  app.innerHTML = `
    <div style="text-align:center">
      <div class="title" style="font-size:clamp(2rem,5vw,3.2rem)">Things I adore about you 👀</div>

      <div class="grid">
        <div class="card">✨ Your energy that pulls me in</div>
        <div class="card">💋 Flirting with you feels too easy</div>
        <div class="card">🥹 We found our way back</div>
        <div class="card">😵‍💫 You live in my head rent free</div>
      </div>

      <button class="btn primary" onclick="s2()">Secret message 👀</button>
    </div>
  `;
}

function s2() {
  app.innerHTML = `
    <div style="text-align:center">
      <div class="title" style="font-size:clamp(2rem,5vw,3.2rem)">Emotional hour 🥹</div>
      <p class="sub">${letter}</p>
      <button class="btn primary" onclick="s3()">One last thing...</button>
    </div>
  `;
}

function s3() {
  app.innerHTML = `
    <div style="text-align:center">
      <iframe src="https://www.youtube.com/embed/8xg3vE8Ie_E?autoplay=1&loop=1&playlist=8xg3vE8Ie_E" allow="autoplay"></iframe>

      <div class="title" style="font-size:clamp(2rem,5vw,3.5rem)">
        Will you be mine again and forever, Riji? 💗
      </div>

      <div style="display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:24px">
        <button class="btn primary">Yes 💕</button>
        <button id="n" class="btn secondary">No 🙄</button>
      </div>
    </div>
  `;

  const n = document.getElementById("n");

  n.onmouseenter = () => {
    n.style.transform = `translate(${Math.random()*260-130}px, ${Math.random()*140-70}px)`;
  };
}

s0();
</script>
</body>
</html>
