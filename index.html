<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>audio test</title>
<style>
body{
margin:0;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:#ffd6ea;
font-family:sans-serif;
}
button{
padding:20px 30px;
font-size:20px;
border:none;
border-radius:20px;
background:#ff73b3;
color:white;
font-weight:bold;
cursor:pointer;
}
</style>
</head>
<body>

<button onclick="startMusic()">🎵 PLAY TEST SONG</button>

<audio id="bgMusic" controls>
  <source src="LoveStory.mp3" type="audio/mpeg">
</audio>

<script>
function startMusic() {
  const music = document.getElementById("bgMusic");
  music.play();
}
</script>

</body>
</html>
