<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mybelovedriji</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Inter, sans-serif;
  background: radial-gradient(circle at top, #ffd6ea, #fff0f6 40%, #ffe0e0 100%);
  min-height: 100vh;
  overflow-x: hidden;
  overflow-y: auto;
  color: #4a2230;
}

.popup {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 99999;
  padding: 20px;
}

.popup-card {
  background: white;
  border-radius: 28px;
  padding: 30px;
  max-width: 420px;
  text-align: center;
  box-shadow: 0 20px 80px rgba(0,0,0,0.2);
}

.popup-title {
  font-family: 'Playfair Display', serif;
  font-size: 2rem;
}

.popup-text {
  margin: 16px 0;
  line-height: 1.7;
}

.btn {
  border: none;
  padding: 14px 22px;
  border-radius: 18px;
  font-weight: 700;
  cursor: pointer;
  transition: 0.2s;
  font-size: 1rem;
}

.btn:hover {
  transform: scale(1.05);
}

.primary {
  background: linear-gradient(135deg, #ff73b3, #ff8d8d);
  color: white;
}

.bg {
  position: fixed;
  inset: 0;
  pointer-events: none;
}

.heart {
  position: absolute;
  opacity: 0.18;
  animation: float 8s infinite ease-in-out;
}

.glass {
  width: min(920px, 92vw);
  background: rgba(255,255,255,0.55);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.5);
  border-radius: 32px;
  box-shadow: 0 20px 80px rgba(190,80,120,0.18);
  padding: 28px;
  position: relative;
  z-index: 2;
  margin: 30px 0;
}

.wrap {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(2rem, 6vw, 4.5rem);
}

.huge-love {
  font-family: 'Playfair Display', serif;
  font-size: clamp(2rem, 7vw, 5rem);
  line-height: 1.15;
  text-align: center;
  word-break: break-word;
}

.sub {
  font-size: clamp(1rem, 2vw, 1.15rem);
  line-height: 1.8;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 14px;
  margin: 24px 0;
}

.card {
  background: rgba(255,255,255,0.72);
  padding: 18px;
  border-radius: 22px;
}

@keyframes float {
  50% { transform: translateY(-26px); }
}
</style>
</head>

<body>

<div class="popup" id="popup">
  <div class="popup-card">
    <div class="popup-title">waittt 😭💗</div>
    <div class="popup-text">
      for the full vibe and maximum emotional damage... press play first 🎶🥹💗
    </div>
    <button class="btn primary" onclick="startMusic()">🎵 play our vibe</button>
  </div>
</div>

<div class="bg" id="bg"></div>

<div class="wrap">
  <div class="glass">
    <div id="app"></div>
  </div>
</div>

<audio id="bgMusic" loop>
  <source src="YOUR_AUDIO_LINK_HERE" type="audio/mpeg">
</audio>

<script>
function startMusic() {
  document.getElementById("bgMusic").play();
  document.getElementById("popup").style.display = "none";
}

for (let i = 0; i < 22; i++) {
  const h = document.createElement("div");
  h.className = "heart";
  h.textContent = "💗";
  h.style.left = Math.random() * 100 + "%";
  h.style.top = Math.random() * 100 + "%";
  h.style.fontSize = (16 + Math.random() * 12) + "px";
  document.getElementById("bg").appendChild(h);
}

const app = document.getElementById("app");

const letter = `
My beloved Rijwana, I don't think you truly understand how much you mean to me. Loving you feels like the easiest thing my heart has ever done. The way you care for me, love me, and make me feel so wanted has genuinely changed something in me.<br><br>

Sometimes I catch myself daydreaming about our little future 😭💗 random trips together, matching outfits, late night food runs, decorating our home together, and our tiny chaotic kids running around while we laugh at how unprepared we are 😭<br><br>

Life genuinely feels prettier with you in it. I care about you more than words can explain. 💗
`;

function s0() {
  app.innerHTML = `
    <div style="text-align:center">
      <div class="title">For my Babeh, Riji 💗</div>
      <p class="sub">Funny how life brought me back to you. Somehow, my heart still found its way back.</p>
      <button class="btn primary" onclick="s1()">Open my heart 💌</button>
    </div>
  `;
}

function s1() {
  app.innerHTML = `
    <div style="text-align:center">
      <div class="title" style="font-size:clamp(2rem,5vw,3.2rem)">Things I adore about you 👀</div>
      <div class="grid">
        <div class="card">🥹 Your smile makes me go crazYYYYYY</div>
        <div class="card">🍯 Your sweetness is way too much for me to handle</div>
        <div class="card">💗 The way you love me set the bar so high nobody compares</div>
        <div class="card">🏡 Our future home, trips, dates, tiny chaotic kids 😭💗</div>
      </div>
      <button class="btn primary" onclick="s2()">Secret message 👀</button>
    </div>
  `;
}

function s2() {
  app.innerHTML = `
    <div style="text-align:center">
      <div class="title">Emotional hour 🥹</div>
      <p class="sub">${letter}</p>
      <button class="btn primary" onclick="s3()">One last thing...</button>
    </div>
  `;
}

function s3() {
  app.innerHTML = `
    <div class="huge-love">
      IIIIIIIIIIIIIIIIIIIIIII<br>
      LOOOOOOOOOOOOOOOOVE<br>
      YOOOOOOOOOOOOOUUUUU<br>
      MY BABEH 😭💗
    </div>
  `;
}

s0();
</script>
</body>
</html>
